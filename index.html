
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>new things are coming...</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --accent-color: #007bff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        h1 { margin-bottom: 0.5rem; font-size: 1.5rem; }
        p { color: #666; margin-bottom: 1.5rem; }
        .links { display: flex; flex-direction: column; gap: 10px; }
        .links a {
            text-decoration: none;
            color: white;
            background: var(--accent-color);
            padding: 10px;
            border-radius: 8px;
            transition: opacity 0.2s;
        }
        .links a:hover { opacity: 0.8; }
        .email { font-size: 0.9rem; margin-top: 1rem; display: block; color: var(--accent-color); }
    </style>
</head>
<body>

    <div class="card">
        <h1>OUTCRY</h1>
        <p></p>
        
        <div class="links">
          <a href="https://instagram. com/outcryofficial" target="_blank">instagram</a>
            <a href="https://on.soundcloud.com/p5yNiN3s5mIwFY5GaB" target="_blank">soundcloud</a>
            <a href="https://facebook.com/outcrymusic" target="_blank">facebook</a>
          <a href="https://youtube.com/@outcry1997" target="_blank">youtube</a>
        </div>

        <a class="email" href="mailto:"></a>
    </div>

</body>
</html>
